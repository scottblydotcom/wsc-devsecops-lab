# Stage 1 of the pipeline: does the code build, lint cleanly, and pass its tests?
# This is on from day one. Note what it does NOT check: security.
name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the pipeline's own identity: this token can read the
# code and nothing else. Agents are identities; so is your CI.
permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to a full commit SHA, not a tag.
      # A tag can be moved to point at different code; a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -v
